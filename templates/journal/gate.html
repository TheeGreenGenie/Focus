{% extends "base.html" %}
{% block title %} — Journal{% endblock %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:60vh;">
  <div class="card p-4 w-100 journal-gate-card" style="max-width:360px;">
    <div class="text-center mb-4">
      <i class="bi bi-journal-lock fs-1 text-secondary"></i>
      <h4 class="mt-2">Mental Health Journal</h4>
      <p class="text-muted small">Enter your journal password to continue.</p>
    </div>
    <form method="post" action="{{ url_for('journal_index') }}">
      <div class="mb-3">
        <input type="password" name="password" class="form-control" placeholder="Password" autofocus required>
      </div>
      <button class="btn btn-primary w-100">Unlock</button>
    </form>
  </div>
</div>
{% endblock %}
