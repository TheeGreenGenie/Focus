{% extends "base.html" %}
{% block title %} — Edit Entry{% endblock %}
{% block content %}
<div class="mb-4">
  <a href="{{ url_for('journal_index') }}" class="text-muted small"><i class="bi bi-arrow-left"></i> Journal</a>
  <h2 class="mt-1">Edit Entry</h2>
  <span class="text-muted small">Created {{ entry.created_at.strftime('%B %d, %Y at %H:%M') }}</span>
</div>

<div class="card p-4" style="max-width:700px;">
  <div class="mb-3">
    <p class="text-muted small mb-1">Prompts:</p>
    {% for stem in stems %}
      <button type="button" class="btn btn-outline-secondary btn-sm mb-1"
        onclick="document.getElementById('edit-body').value += '{{ stem }} '">
        {{ stem }}
      </button>
    {% endfor %}
  </div>
  <form method="post">
    <div class="mb-3">
      <textarea name="body" id="edit-body" class="form-control" rows="10" required>{{ entry.body }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label small text-muted">Stress level: <span id="stress-val">{{ entry.stress_level or 5 }}</span>/10</label>
      <input type="range" name="stress_level" class="form-range" min="1" max="10"
        value="{{ entry.stress_level or 5 }}"
        oninput="document.getElementById('stress-val').textContent=this.value">
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">Save Changes</button>
      <a href="{{ url_for('journal_index') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
